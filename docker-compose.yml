
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: walletdb
      POSTGRES_USER: zen
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zen -d walletdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - backend.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # opcional en dev: hot reload montando código local
    # volumes:
    #   - .:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    command: npm run dev -- --host
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000/api

    depends_on:
      - backend 
    ports:
      - "5173:5173"

volumes:
  pgdata:
